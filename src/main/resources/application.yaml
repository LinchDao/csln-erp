server:
  port: 8000
  servlet:
    context-path: /erp-service

# JWT??
jwt:
  secret: your-secret-key-1234567890abcdefg-2026 # ???????????
  tokenKey: csln-token
  expire:
    normal: 7200000 # ???????2??????
    remember: 604800000 # ??????7?????

spring:
  application:
    name: csln-erp
  datasource:
    url: jdbc:mysql://localhost:3306/erp2?allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 50MB

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.dormitory.dormitory_backend.mapper: DEBUG..

app:
  security:
    password-salt: dev-salt-123456
    salt-enabled: true
    default-password: 123456

  data:
    redis:
      host: localhost
      port: 6379

file:
  upload:
    base-path: E:/stuspeace/csln-erp/data/upload/
    temp-path: E:/stuspeace/csln-erp/data/data/csln_erp/temp/
    max-size: 100
    allow-override: false
    support-types:
      image: jpg,jpeg,png,gif,bmp,webp
      other: pdf,doc,docx,xls,xlsx,zip,rar,txt,csv,ppt,pptx

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lin.csln.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
